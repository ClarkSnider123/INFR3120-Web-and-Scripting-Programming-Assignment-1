<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width">
            <!--Webpage title-->
            <title>Contact Me - Clark Snider's website</title>
            <!--Link to the style sheets-->
            <link href="laptop.css" rel="stylesheet" type="text/css" media="only screen and (min-width:960px)">
            <link href="tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width:481px) and (max-width:960px)">
            <link href="phone.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">
    </head>
    <body>
        <div id = "wrapper">
            <div id = "banner">
                <!--Page Title-->
                <h1 style="text-align: center;">Contact Me</h1>
            </div>
            <nav>
                <!--Navigation-->
                <div id = "button">
                    <form style="display: inline;" action = "index.html"><button class="button button1">Home Page</button></form>
                    <form style="display: inline;" action = "aboutMe.html"><button class="button button2">About Me</button></form>
                    <form style="display: inline;" action = "contactMe.html"><button class="button button3">Contact Me</button></form>
                    <form style="display: inline;" action = "project.html"><button class="button button4">Projects</button></form>          
                </div>
            </nav>
            <!--Form-->
            <form class="contactForm" action="homePage.html">
                <label for= "name">Name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for= "email">Email:</label><br>
                <input type="text" id="email" name="email" required><br>
                <label for= "message">Message:</label><br>
                <textarea type="text" id="message" name="message" rows="8" cols="50" required></textarea><br> 
                <input type="checkbox" id="robotTest" name="robotTest" value="robot" required>
                <label for="robotTest">I am not a robot</label><br>
                <input type="submit" value="Submit">
            </form>
            <div class="clear"></div>
            <!--Footer with copyright-->
            <div id="footer">
                <h3 >&copy; 2026 by Clark Snider</h3>
                <h3>Contact: clark.snider@ontariotechu.net</h3>
            </div>
        </div>
    </body>
</html>
